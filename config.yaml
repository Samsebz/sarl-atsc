seed: 42

video:
  confidence_threshold: 0.50
  observation_distance_m: 100.0
  speed_threshold_kmh: 2.0
  history_frames: 10

dqn:
  state_size: 16
  action_size: 4
  hidden_size: 256
  learning_rate: 0.0005
  gamma: 0.95
  epsilon_start: 1.0
  epsilon_min: 0.01
  epsilon_decay: 0.995
  replay_capacity: 50000
  batch_size: 64
  target_update: 1000

safety:
  min_green_seconds: 10
  max_red_seconds: 90

adaptation:
  kl_threshold: 0.50
  inner_steps: 5
  learning_rate: 0.0001

simulation:
  max_steps: 300
  lanes: 4
